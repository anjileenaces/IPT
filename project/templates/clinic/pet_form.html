{% extends "base.html" %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} pet — PawCare{% endblock %}
{% block content %}
<h1>{% if object %}Edit{% else %}Add{% endif %} pet</h1>
<form method="post" class="stack-form narrow">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn-primary">Save</button>
  <a href="{% url 'clinic:pets' %}" class="btn-ghost">Cancel</a>
</form>
{% endblock %}
