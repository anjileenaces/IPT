{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block content %}
<div class="auth-card card narrow">
  <h1>New password</h1>
  {% if validlink %}
    <form method="post" class="stack-form">{% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Save password</button>
    </form>
  {% else %}
    <p class="alert alert-error">This reset link is invalid or expired.</p>
  {% endif %}
</div>
{% endblock %}
