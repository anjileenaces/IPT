{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth-card card narrow">
  <h1>Forgot password</h1>
  <p class="muted">We will email you a reset link (check console output if using dev email backend).</p>
  <form method="post" class="stack-form">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Send link</button>
  </form>
</div>
{% endblock %}
